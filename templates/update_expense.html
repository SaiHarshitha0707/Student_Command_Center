{% extends 'base_expense.html' %}
{% block body %}

    <section class="card">
        <span class="tab update">Update</span>
        <h2 class="card__title">Top Up an Existing Expense</h2>
        <p class="card__blurb">Adds this amount to the matching category + description entry, and refreshes its date. Fails if no match exists.</p>
        <form action="/update_expense/{{expense.category}}/{{expense.desc}}" method="post" id="updateForm" class="form-grid" novalidate>
            <div class="field">
                <label for="updCategory">Category</label>
                <input id="updCategory" name="updCategory" type="text" value="{{expense.category}}">
            </div>
            <div class="field">
                <label for="updDescription">Description</label>
                <input id="updDescription" name="updDesc" type="text" value="{{expense.desc}}">
            </div>
            <div class="field">
                <label for="updDate">New date</label>
                <input id="updDate" name="updDate" type="date" value="{{expense.date}}">
            </div>
            <div class="field">
                <label for="updAmount">Amount to add (₹)</label>
                <input id="updAmount" name="updAmount" type="number" min="0.01" step="0.01" value="{{expense.amount}}">
            </div>
            <button type="submit" class="btn update">Update</button>
        </form>
        <p class="msg" id="updateMsg"></p>
    </section>

{% endblock body %}
