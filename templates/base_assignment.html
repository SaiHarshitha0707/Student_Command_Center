<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assignment Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Karla:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --kraft:        #EBE1C8;
    --kraft-dark:   #DCCFAE;
    --paper:        #FBF8F1;
    --ink:          #202A3C;
    --ink-soft:     #5B6478;
    --rule:         #D8CBA6;
    --tasks:        #D64545;
    --done:         #3F8F5F;
    --update:       #C98A1E;
    --pending:      #F5A623;
    --danger:       #D64545;
    --radius-card: 4px 4px 14px 14px;
    --shadow-card: 0 10px 24px -14px rgba(32,42,60,.45), 0 2px 4px rgba(32,42,60,.08);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; min-height:100vh;
    background-color: var(--kraft);
    background-image:
      repeating-linear-gradient(135deg, rgba(255,255,255,.35) 0 2px, transparent 2px 26px),
      radial-gradient(ellipse at top left, var(--kraft-dark), transparent 60%);
    font-family:'Karla', sans-serif;
    color: var(--ink);
    padding: clamp(16px, 4vw, 48px);
  }
  .wrap{ max-width: 1040px; margin: 0 auto; }

  .refresh-row{ display:flex; justify-content:flex-end; margin-top:18px; }
  .btn{
    font-family:'Space Mono', monospace; font-size:.76rem; letter-spacing:.06em;
    text-transform:uppercase; color:#fff; background: var(--stats);
    border:none; padding:10px 16px; border-radius:20px; cursor:pointer; margin: 1.5px;
  }
  a{
    text-decoration: none;
    color: inherit;
  }

  /* ---- ID CARD HEADER ---- */
  .id-card{
    position:relative;
    background: linear-gradient(160deg, #26314A, var(--ink) 70%);
    color: var(--paper);
    border-radius: 18px;
    padding: 34px clamp(20px,4vw,44px) 26px;
    overflow:hidden;
    box-shadow: var(--shadow-card);
    display:flex; flex-wrap:wrap;
    align-items:flex-start; justify-content:space-between;
    gap:18px;
    opacity:0; animation: rise .6s ease forwards;
  }
  .id-card__hole{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    width:52px; height:10px; border-radius:6px;
    background: rgba(0,0,0,.35);
    box-shadow: inset 0 2px 3px rgba(0,0,0,.5);
  }
  .id-card__main{ max-width: 560px; margin-top: 20px;}
  .id-card__eyebrow{
    font-family:'Space Mono', monospace; font-size:.72rem; letter-spacing:.14em;
    color:#FFD23F; margin:0 0 10px; text-transform:uppercase;
  }
  .id-card__title{
    font-family:'Fraunces', serif; font-weight:600;
    font-size: clamp(1.9rem, 4.4vw, 2.9rem); line-height:1.05; margin:0 0 12px;
  }
  .id-card__title em{ font-style:italic; font-weight:500; color:#FFD23F; }
  .id-card__sub{ margin:0; font-size:1rem; color:#C7CCDA; max-width:46ch; line-height:1.5; }
  .id-card__meta{
    font-family:'Space Mono', monospace; text-align:right; margin-top:20px;
    display:flex; flex-direction:column; gap:4px;
  }
  .id-card__clock{ font-size:1.6rem; font-weight:700; letter-spacing:.03em; }
  .id-card__date{ font-size:.8rem; color:#9AA2B4; text-transform:uppercase; letter-spacing:.08em; }
  .id-card__barcode{
    position:absolute; left:0; right:0; bottom:0; height:14px;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 2px, transparent 2px 5px, rgba(255,255,255,.25) 5px 6px, transparent 6px 9px);
    opacity:.5;
  }

  /* ---- STATS ROW ---- */
  .stat-strip{
    margin-top:22px; display:grid;
    grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap:16px;
  }
  .stat-card{
    background: var(--paper); border-radius: var(--radius-card);
    box-shadow: var(--shadow-card); padding:16px 18px;
    border-left:4px solid var(--tasks);
    opacity:0; animation: rise .5s ease forwards;
  }
  .stat-card:nth-child(1){animation-delay:.08s}
  .stat-card:nth-child(2){animation-delay:.14s}
  .stat-card:nth-child(3){animation-delay:.2s}
  .stat-card__num{ font-family:'Space Mono', monospace; font-weight:700; font-size:1.5rem; display:block; }
  .stat-card__label{ font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color: var(--ink-soft); }

  /* ---- GENERAL CARD ---- */
  .card{
    position:relative;
    background: var(--paper);
    border-radius: var(--radius-card);
    padding: 30px 22px 24px 30px;
    box-shadow: var(--shadow-card);
    margin-top: 30px;
    opacity:0; animation: rise .55s ease forwards; animation-delay:.25s;
  }
  .card::before{
    content:"";
    position:absolute; left:-7px; top:26px;
    width:14px; height:14px; border-radius:50%;
    background: var(--kraft);
    box-shadow:
      0 0 0 1px rgba(32,42,60,.06),
      inset 0 1px 2px rgba(32,42,60,.35),
      0 56px 0 var(--kraft), 0 56px 0 -1px rgba(32,42,60,.06), 0 56px 1px -1px rgba(32,42,60,.3);
  }
  .tab{
    position:absolute; top:-14px; left:26px;
    background: var(--tasks); color:#fff;
    font-family:'Space Mono', monospace; font-size:.68rem;
    letter-spacing:.1em; text-transform:uppercase;
    padding:6px 12px; border-radius:6px 6px 0 0;
  }
  .tab.update{ background: var(--update); }
  .tab.done{ background: var(--done); }
  .card__title{ font-family:'Fraunces', serif; font-weight:600; font-size:1.3rem; margin:6px 0 4px; }
  .card__blurb{ margin:0 0 18px; font-size:.9rem; line-height:1.5; color: var(--ink-soft); }

  /* ---- FORM ---- */
  .form-grid{
    display:grid; grid-template-columns: 1fr 1.4fr 1fr .8fr auto; gap:12px; align-items:end;
  }
  .field label{
    display:block; font-family:'Space Mono', monospace; font-size:.68rem;
    letter-spacing:.08em; text-transform:uppercase; color: var(--ink-soft); margin-bottom:6px;
  }
  .field input, .field select{
    width:100%; padding:10px 12px; font-family:'Karla', sans-serif; font-size:.95rem;
    border:1.5px solid var(--rule); border-radius:8px; background:#fff; color:var(--ink);
  }
  .field input:focus-visible, .field select:focus-visible{ outline:3px solid var(--ink); outline-offset:1px; }
  .btn{
    font-family:'Space Mono', monospace; font-size:.76rem; letter-spacing:.06em;
    text-transform:uppercase; color:#fff; background: var(--tasks);
    border:none; padding:11px 16px; border-radius:20px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{ filter:brightness(1.08); }
  .btn.update{ background: var(--update); }
  .btn.ghost{ background:transparent; color:var(--ink); border:1.5px solid var(--ink); }

  .msg{
    font-family:'Space Mono', monospace; font-size:.78rem; margin-top:14px;
    padding:9px 12px; border-radius:8px; display:none;
  }
  .msg.show{ display:block; }
  .msg.ok{ background: color-mix(in srgb, var(--done) 14%, white); color:#245C3B; }
  .msg.err{ background: color-mix(in srgb, var(--tasks) 14%, white); color:#8C2A2A; }

  /* ---- UPDATE FIELD SWITCH ---- */
  .update-toggle{ display:flex; gap:8px; margin-bottom:16px; }
  .update-toggle button{
    font-family:'Space Mono', monospace; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase;
    padding:8px 14px; border-radius:16px; border:1.5px solid var(--ink); background:transparent;
    color: var(--ink); cursor:pointer;
  }
  .update-toggle button.active{ background: var(--ink); color:#fff; }

  /* ---- VIEW FILTER TABS ---- */
  .view-tabs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .view-tabs button{
    font-family:'Space Mono', monospace; font-size:.72rem; letter-spacing:.06em; text-transform:uppercase;
    padding:8px 14px; border-radius:16px; border:1.5px solid var(--ink); background:transparent;
    color: var(--ink); cursor:pointer;
  }
  .view-tabs button.active{ background: var(--ink); color:#fff; }
  .tool-row{ display:flex; flex-wrap:wrap; gap:10px; align-items:end; margin-bottom:6px; }
  .tool-row .field{ flex:1; min-width:160px; }

  /* ---- LEDGER TABLE ---- */
  .ledger{ width:100%; border-collapse:collapse; margin-top:8px; }
  .ledger thead th{
    text-align:left; font-family:'Space Mono', monospace; font-size:.68rem;
    letter-spacing:.08em; text-transform:uppercase; color: var(--ink-soft);
    padding:8px 10px; border-bottom:2px solid var(--ink);
  }
  .ledger tbody td{
    padding:10px 10px; border-bottom:1px dashed var(--rule); font-size:.9rem;
  }
  .ledger tbody tr:hover{ background: color-mix(in srgb, var(--tasks) 6%, white); }
  .ledger .num{ font-family:'Space Mono', monospace; }
  .ledger .del-btn{
    background:none; border:none; color: var(--tasks); cursor:pointer;
    font-family:'Space Mono', monospace; font-size:.72rem; text-transform:uppercase;
  }
  .ledger .del-btn:hover{ text-decoration:underline; }
  .empty-row td{ text-align:center; color: var(--ink-soft); padding:22px; font-style:italic; }

  .status-pill{
    font-family:'Space Mono', monospace; font-size:.68rem; letter-spacing:.06em;
    padding:4px 10px; border-radius:12px; text-transform:uppercase; display:inline-block;
  }
  .status-pill.C{ background: color-mix(in srgb, var(--done) 18%, white); color:#245C3B; }
  .status-pill.IC{ background: color-mix(in srgb, var(--tasks) 18%, white); color:#8C2A2A; }

  .btn-pending {
    display: inline-block;
    border: 1px solid var(--pending);
    background: transparent;
    color: var(--pending);
    text-decoration: none;
    font-family: inherit;
    font-size:.9rem; 
    letter-spacing:.06em; 
    text-transform:uppercase;
    padding:8px 14px; 
    border-radius:16px;
  }

  .btn-pending:hover {
    background: var(--pending);
    color: white;
  }

  .btn-completed {
    display: inline-block;
    border: 1px solid var(--done);
    background: transparent;
    color: var(--done);
    text-decoration: none;
    font-family: inherit;
    font-size:.9rem; 
    letter-spacing:.06em; 
    text-transform:uppercase;
    padding:8px 14px; 
    border-radius:16px;
  }

  .btn-completed:hover {
    background: var(--done);
    color: white;
  }

  .delete-btn {
    display: inline-block;
    padding: 4px 8px;
    border: 1px solid var(--danger);
    border-radius: 4px;
    background: transparent;
    color: var(--danger);
    text-decoration: none;
    font-size: 0.75rem;
    font-family: inherit;
  }

  .delete-btn:hover {
    background: var(--danger);
    color: white;
  }

  .update-btn {
    display: inline-block;
    padding: 4px 8px;
    border: 1px solid var(--update);
    border-radius: 4px;
    background: transparent;
    color: var(--update);
    text-decoration: none;
    font-size: 0.75rem;
    font-family: inherit;
  }

  .update-btn:hover {
    background: var(--update);
    color: white;
  }

  footer{
    text-align:center; margin-top:30px; font-family:'Space Mono', monospace;
    font-size:.74rem; letter-spacing:.05em; color: var(--ink-soft);
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }
  :focus-visible{ outline: 3px solid var(--ink); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } .card,.id-card,.stat-card{ opacity:1; transform:none; } }
  @media (max-width: 780px){
    .id-card{ flex-direction:column; } .id-card__meta{ text-align:left; }
    .form-grid{ grid-template-columns: 1fr; }
    .card{ padding-left:26px; }
  }
</style>
</head>

<body>
    {% block body %}  

    {% endblock body %}
</body>
</html>
